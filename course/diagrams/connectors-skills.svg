<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-label="Connectors use MCP to let Claude read and act in your apps, asking before it acts; skills sit in a library and only the relevant one is loaded into the chat.">
<style>
svg{color:#18211e}
.t{font:500 13px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#18211e}
.b{font-weight:700}
.ts{font:12px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#5b6863}
.tm{font:500 12px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#b97a0c}
.ta{font:600 12px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#0e6b66}
.bx{fill:#ffffff;stroke:#c9d2cd;stroke-width:1.5}
.bxa{fill:#e2efed;stroke:#0e6b66;stroke-width:1.5}
.bxm{fill:#f8edd6;stroke:#b97a0c;stroke-width:1.5}
.ln{stroke:#5b6863;stroke-width:1.5;fill:none}
.lna{stroke:#0e6b66;stroke-width:2;fill:none}
.lnm{stroke:#b97a0c;stroke-width:2;fill:none}
.dash{stroke-dasharray:5 4}
.ahf{fill:#5b6863;fill:context-stroke}
</style>
<rect width="680" height="310" fill="#f6f7f4"/>
<defs><marker id="ah-cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahf"/></marker></defs>
<rect x="16" y="100" width="96" height="56" rx="10" class="bxm"/><text x="64" y="133" class="t b" text-anchor="middle">You</text>
<line x1="112" y1="128" x2="168" y2="128" class="ln" marker-end="url(#ah-cs)"/>
<text x="140" y="118" class="ts" text-anchor="middle">ask</text>
<rect x="170" y="90" width="140" height="76" rx="12" class="bx"/>
<text x="240" y="124" class="t b" text-anchor="middle">Claude</text><text x="240" y="144" class="ts" text-anchor="middle">picks tools to call</text>
<line x1="310" y1="128" x2="348" y2="128" class="ln" marker-end="url(#ah-cs)" marker-start="url(#ah-cs)"/>
<rect x="350" y="36" width="34" height="194" rx="8" class="bxa"/>
<text x="367" y="133" class="t b" text-anchor="middle" transform="rotate(-90 367 133)">MCP</text>
<rect x="420" y="40" width="112" height="36" rx="8" class="bx"/><text x="476" y="63" class="t" text-anchor="middle">Gmail</text>
<rect x="420" y="90" width="112" height="36" rx="8" class="bx"/><text x="476" y="113" class="t" text-anchor="middle">Calendar</text>
<rect x="420" y="140" width="112" height="36" rx="8" class="bx"/><text x="476" y="163" class="t" text-anchor="middle">Google Drive</text>
<rect x="420" y="190" width="112" height="36" rx="8" class="bx"/><text x="476" y="213" class="t" text-anchor="middle">Slack</text>
<line x1="384" y1="58" x2="418" y2="58" class="ln" marker-end="url(#ah-cs)"/><line x1="384" y1="108" x2="418" y2="108" class="ln" marker-end="url(#ah-cs)"/><line x1="384" y1="158" x2="418" y2="158" class="ln" marker-end="url(#ah-cs)"/><line x1="384" y1="208" x2="418" y2="208" class="ln" marker-end="url(#ah-cs)"/>
<text x="544" y="63" class="ts">find, draft replies</text>
<text x="544" y="113" class="ts">list, create events</text>
<text x="544" y="163" class="ts">search, read docs</text>
<text x="544" y="213" class="ts">read, post messages</text>
<text x="420" y="252" class="tm">Actions like send or post ask you first</text>
<text x="336" y="283" class="t b">Skills library</text>
<rect x="20" y="262" width="96" height="32" rx="7" class="bxa"/><text x="68" y="283" class="ts" text-anchor="middle">Brand voice</text>
<rect x="124" y="262" width="96" height="32" rx="7" class="bx dash"/><text x="172" y="283" class="ts" text-anchor="middle">Monthly review</text>
<rect x="228" y="262" width="96" height="32" rx="7" class="bx dash"/><text x="276" y="283" class="ts" text-anchor="middle">Review replies</text>
<path d="M68 262V200H210V168" class="lna" marker-end="url(#ah-cs)"/>
<text x="78" y="220" class="ts">loaded only when relevant</text>
</svg>
