<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="A good brief has five parts; the first answer is a draft that you steer in the same chat until it is good enough to use.">
<defs><marker id="ah-pl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahf"/></marker></defs>
<text x="20" y="26" class="t b">Your brief</text>
<rect x="20" y="40" width="190" height="230" rx="12" class="bxa"/>
<rect x="34" y="56" width="162" height="34" rx="7" class="bx"/><text x="46" y="78" class="t">Context</text>
<rect x="34" y="98" width="162" height="34" rx="7" class="bx"/><text x="46" y="120" class="t">Task</text>
<rect x="34" y="140" width="162" height="34" rx="7" class="bx"/><text x="46" y="162" class="t">Audience and goal</text>
<rect x="34" y="182" width="162" height="34" rx="7" class="bx"/><text x="46" y="204" class="t">Constraints</text>
<rect x="34" y="224" width="162" height="34" rx="7" class="bx"/><text x="46" y="246" class="t">Examples, materials</text>
<line x1="210" y1="150" x2="268" y2="150" class="ln" marker-end="url(#ah-pl)"/>
<text x="239" y="140" class="ts" text-anchor="middle">send</text>
<rect x="270" y="120" width="120" height="60" rx="10" class="bx"/>
<text x="330" y="147" class="t b" text-anchor="middle">Claude</text><text x="330" y="166" class="ts" text-anchor="middle">writes a draft</text>
<line x1="390" y1="150" x2="438" y2="150" class="ln" marker-end="url(#ah-pl)"/>
<rect x="440" y="120" width="110" height="60" rx="10" class="bx"/>
<text x="495" y="147" class="t b" text-anchor="middle">You review</text><text x="495" y="166" class="ts" text-anchor="middle">is it right?</text>
<line x1="550" y1="150" x2="588" y2="150" class="lna" marker-end="url(#ah-pl)"/>
<text x="569" y="140" class="ts" text-anchor="middle">yes</text>
<rect x="590" y="120" width="72" height="60" rx="10" class="bxa"/>
<text x="626" y="155" class="t b" text-anchor="middle">Use it</text>
<path d="M495 180V236H330V182" class="lnm" marker-end="url(#ah-pl)"/>
<text x="412" y="256" class="tm" text-anchor="middle">not yet: steer in the same chat</text>
<text x="412" y="274" class="ts" text-anchor="middle">"shorter", "warmer", "add the refund policy"</text>
</svg>
