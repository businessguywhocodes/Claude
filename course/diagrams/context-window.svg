<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Everything Claude uses for a reply is inside the context window; things outside it are invisible unless you add them.">
<style>
svg{color:#18211e}
.t{font:500 13px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#18211e}
.b{font-weight:700}
.ts{font:12px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#5b6863}
.tm{font:500 12px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#b97a0c}
.ta{font:600 12px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#0e6b66}
.bx{fill:#ffffff;stroke:#c9d2cd;stroke-width:1.5}
.bxa{fill:#e2efed;stroke:#0e6b66;stroke-width:1.5}
.bxm{fill:#f8edd6;stroke:#b97a0c;stroke-width:1.5}
.ln{stroke:#5b6863;stroke-width:1.5;fill:none}
.lna{stroke:#0e6b66;stroke-width:2;fill:none}
.lnm{stroke:#b97a0c;stroke-width:2;fill:none}
.dash{stroke-dasharray:5 4}
.ahf{fill:#5b6863;fill:context-stroke}
</style>
<rect width="680" height="360" fill="#f6f7f4"/>
<defs><marker id="ah-ctx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahf"/></marker></defs>
<text x="20" y="26" class="t b">Context window</text>
<rect x="20" y="40" width="300" height="290" rx="12" class="bxa"/>
<rect x="36" y="56" width="268" height="34" rx="7" class="bx"/><text x="50" y="78" class="t">Profile preferences</text>
<rect x="36" y="98" width="268" height="34" rx="7" class="bx"/><text x="50" y="120" class="t">Project instructions and files</text>
<rect x="36" y="140" width="268" height="34" rx="7" class="bx"/><text x="50" y="162" class="t">Memory from past chats</text>
<rect x="36" y="182" width="268" height="34" rx="7" class="bx"/><text x="50" y="204" class="t">Uploads, web search, connectors</text>
<rect x="36" y="224" width="268" height="34" rx="7" class="bx"/><text x="50" y="246" class="t">Conversation so far</text>
<rect x="36" y="266" width="268" height="34" rx="7" class="bxm"/><text x="50" y="288" class="t b">Your new message</text>
<line x1="320" y1="180" x2="378" y2="180" class="ln" marker-end="url(#ah-ctx)"/>
<text x="349" y="170" class="ts" text-anchor="middle">reads all</text>
<rect x="380" y="150" width="120" height="60" rx="10" class="bx"/>
<text x="440" y="177" class="t b" text-anchor="middle">Claude</text><text x="440" y="196" class="ts" text-anchor="middle">model</text>
<line x1="500" y1="180" x2="548" y2="180" class="ln" marker-end="url(#ah-ctx)"/>
<text x="524" y="170" class="ts" text-anchor="middle">writes</text>
<rect x="550" y="150" width="110" height="60" rx="10" class="bx"/>
<text x="605" y="177" class="t b" text-anchor="middle">Reply</text><text x="605" y="196" class="ts" text-anchor="middle">word by word</text>
<path d="M605 210V241H306" class="ln dash" marker-end="url(#ah-ctx)"/>
<text x="455" y="234" class="ts" text-anchor="middle">next turn: the reply joins the conversation</text>
<rect x="380" y="276" width="280" height="54" rx="10" class="bx dash"/>
<text x="520" y="298" class="ts" text-anchor="middle">Outside the window: your inbox, other chats,</text>
<text x="520" y="316" class="ts" text-anchor="middle">company systems. Invisible unless added.</text>
</svg>
