  document.getElementById("progressFill").style.width = (100 * n / countable.length) + "%";
}

function addCopy(pre) {
  const wrap = document.createElement("div");
  wrap.className = "codewrap";
  pre.replaceWith(wrap); wrap.append(pre);
  const b = document.createElement("button");
  b.className = "copy"; b.type = "button"; b.textContent = "Copy";
  b.addEventListener("click", () => {
    const text = pre.innerText;
    const ok = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = "Selected: press Ctrl/⌘+C";
      setTimeout(() => b.textContent = "Copy", 2500);
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  });
  wrap.append(b);
}

function wrapPanels(article) {
  // Group "Try it" and "Key takeaways" h2 sections into panels.
  [...article.querySelectorAll("h2")].forEach(h => {
    const label = h.textContent.trim().toLowerCase();
    if (label !== "try it" && label !== "key takeaways") return;
    const panel = document.createElement("section");
    panel.className = "panel" + (label === "try it" ? " try" : "");
    h.before(panel);
    let n = h;
    while (n && !(n !== h && n.tagName === "H2")) { const next = n.nextElementSibling; panel.append(n); n = next; }
  });
}

function render(id) {
  const m = byId(id) || MODULES[0];
  const article = document.getElementById("article");
  if (window.marked) {
    article.innerHTML = marked.parse(m.md, { gfm: true });
  } else {
    const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = m.md;
    article.innerHTML = ""; article.append(pre);
  }
  article.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.append(t); });
  article.querySelectorAll("pre").forEach(addCopy);
  article.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/\.md(#.*)?$/.test(href) && !/^https?:/.test(href)) {
      const target = fileToId(href);
      if (target) a.setAttribute("href", "#" + target);
    } else if (/^https?:/.test(href)) {
      a.target = "_blank"; a.rel = "noopener";
    }
  });
  wrapPanels(article);

  const kt = document.getElementById("keytag");
  kt.innerHTML = "";
  const i = document.createElement("i"); i.textContent = m.room;
  const s = document.createElement("span"); s.textContent = m.label;
  kt.append(i, s);

  renderQuiz(m);
  const row = document.getElementById("completeRow");
  row.hidden = !m.countable;
  updateDoneBtn(m);

  const idx = MODULES.indexOf(m);
  const pager = document.getElementById("pager");
  pager.innerHTML = "";
  const mk = (mm, cls, lbl) => {
    const a = document.createElement("a"); a.href = "#" + mm.id; a.className = cls;
    const sm = document.createElement("small"); sm.textContent = lbl;
    const t = document.createElement("span"); t.textContent = mm.room + " · " + mm.short;
    a.append(sm, t); return a;
  };
  if (idx > 0) pager.append(mk(MODULES[idx - 1], "prev", "Previous"));
  if (idx < MODULES.length - 1) pager.append(mk(MODULES[idx + 1], "next", "Next"));

  document.title = m.id === "welcome" ? "Claude 101 and Beyond" : m.short + " · Claude 101 and Beyond";
  buildNav(m.id);
  store.set("c101-last", m.id);
}


function renderQuiz(m) {
  const box = document.getElementById("quiz");
  box.innerHTML = "";
  const qs = m.quiz || [];
  box.hidden = qs.length === 0;
  if (!qs.length) return;
  const h = document.createElement("h2");
  h.textContent = m.id === "capstone" ? "Final quiz" : "Check your understanding";
  const lead = document.createElement("p");
  lead.className = "lead";
  lead.textContent = qs.length + " questions. Pick an answer to see the explanation.";
  box.append(h, lead);
  let answered = 0, correct = 0;
  const foot = document.createElement("div"); foot.className = "quiz-foot";
  const score = document.createElement("span"); score.className = "score";
  const retry = document.createElement("button"); retry.className = "btn"; retry.type = "button"; retry.textContent = "Try again";
  retry.addEventListener("click", () => { renderQuiz(m); box.scrollIntoView({ block: "start" }); });
  const updateScore = () => {
    score.textContent = answered < qs.length
      ? answered + " of " + qs.length + " answered"
      : "You scored " + correct + " of " + qs.length + (correct === qs.length ? ". Perfect." : ".");
    retry.hidden = answered < qs.length;
  };
  qs.forEach((q, qi) => {
    const wrap = document.createElement("div"); wrap.className = "q";
    const p = document.createElement("p"); p.className = "q-text";
    const n = document.createElement("span"); n.className = "q-num"; n.textContent = (qi + 1) + ".";
    p.append(n, document.createTextNode(q.q));
    const opts = document.createElement("div"); opts.className = "opts";
    const buttons = q.options.map((o, oi) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opt";
      const l = document.createElement("span"); l.className = "letter"; l.textContent = "ABCD"[oi];
      const t = document.createElement("span"); t.textContent = o;
      b.append(l, t);
      b.addEventListener("click", () => {
        buttons.forEach(x => x.disabled = true);
        const ok = oi === q.answer;
        buttons[q.answer].classList.add("right");
        if (!ok) b.classList.add("wrong");
        const why = document.createElement("p"); why.className = "why" + (ok ? "" : " miss");
        const lead = document.createElement("b"); lead.textContent = ok ? "Correct. " : "Not quite. The answer is " + "ABCD"[q.answer] + ". ";
        why.append(lead, document.createTextNode(q.why));
        wrap.append(why);
        answered++; if (ok) correct++;
        updateScore();
        if (answered === qs.length) {
          const best = store.get("c101-quiz-" + m.id, -1);
          if (correct > best) store.set("c101-quiz-" + m.id, correct);
          buildNav(m.id);
        }
      });
      opts.append(b);
      return b;
    });
    wrap.append(p, opts);
    box.append(wrap);
  });
  foot.append(score, retry);
  box.append(foot);
  updateScore();
}

function updateDoneBtn(m) {
  const b = document.getElementById("doneBtn");
  const isDone = done.has(m.id);
  b.textContent = isDone ? "Done ✓ (click to undo)" : "Mark this module as done";
  b.classList.toggle("done", isDone);
}

document.getElementById("doneBtn").addEventListener("click", () => {
  const id = currentId();
  done.has(id) ? done.delete(id) : done.add(id);
  store.set("c101-done", [...done]);
  updateDoneBtn(byId(id));
  buildNav(id);
});

function currentId() {
  const h = location.hash.replace("#", "");
  return byId(h) ? h : MODULES[0].id;
}

const side = document.getElementById("side");
const menuBtn = document.getElementById("menuBtn");
menuBtn.addEventListener("click", () => {
  const open = side.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open);
});
side.addEventListener("click", e => { if (e.target.closest("a")) { side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", false); } });

const themeBtn = document.getElementById("themeBtn");
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(store.get("c101-theme", null));
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next); store.set("c101-theme", next);
});

window.addEventListener("hashchange", () => { render(currentId()); window.scrollTo(0, 0); });
if (!location.hash) {
  const last = store.get("c101-last", null);
  render(last && byId(last) ? last : MODULES[0].id);
} else {
  render(currentId());
}
</script>
