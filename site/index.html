<style>
/* Layout: hotel-directory reader. Sticky top bar, a "floor directory" sidebar (tracks are floors, modules are rooms), one reading column. */
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --ink: #18211e;
  --muted: #5b6863;
  --line: #dde3df;
  --accent: #0e6b66;
  --accent-ink: #ffffff;
  --accent-soft: #e2efed;
  --marigold: #b97a0c;
  --marigold-soft: #f8edd6;
  --code-bg: #eef1ee;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w: 296px;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
    --accent: #4fbdb5; --accent-ink: #0b1513; --accent-soft: #1b2e2b;
    --marigold: #e8b04a; --marigold-soft: #2e2618; --code-bg: #1d2623;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
  --accent: #4fbdb5; --accent-ink: #0b1513; --accent-soft: #1b2e2b;
  --marigold: #e8b04a; --marigold-soft: #2e2618; --code-bg: #1d2623;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
  font-family: var(--font-ui);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; overflow: hidden; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .spacer { flex: 1; }
.btn {
  font-family: var(--font-ui); font-size: 14px; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary.done { background: var(--accent-soft); color: var(--accent); }
#menuBtn { display: none; }

/* Shell */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--bar-h)); }
.side {
  position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  font-family: var(--font-ui);
}
.progress { display: grid; gap: 6px; margin-bottom: 20px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.floor { margin-top: 18px; }
.floor h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a {
  display: grid; grid-template-columns: 52px 1fr 16px; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3;
}
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; text-align: center;
  padding: 2px 0; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); background: var(--bg);
  font-variant-numeric: tabular-nums;
}
.nav a[aria-current="page"] .tag { border-color: var(--accent); color: var(--accent); }
.tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); }
.tick.on { background: var(--accent); border-color: var(--accent); position: relative; }
.tick.on::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Reading column */
main { min-width: 0; padding-block: 36px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 46rem; margin: 0 auto; }
.keytag {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: 13px; color: var(--marigold);
  background: var(--marigold-soft); border-radius: 999px; padding: 4px 12px 4px 6px; margin-bottom: 14px;
}
.keytag i { font-style: normal; font-family: var(--font-mono); font-weight: 500; background: var(--marigold); color: var(--surface); border-radius: 999px; padding: 1px 8px; }

article h1, article h2, article h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; letter-spacing: -0.015em; }
article h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; margin: 0 0 6px; }
article h1 + p strong:only-child { font-family: var(--font-ui); font-weight: 500; font-size: 14px; color: var(--muted); }
article h2 { font-size: 25px; font-weight: 700; margin: 2.2em 0 0.5em; padding-top: 0.9em; border-top: 1px solid var(--line); }
article h3 { font-size: 19px; font-weight: 500; margin: 1.7em 0 0.4em; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li { margin: 0.25em 0; }
article li::marker { color: var(--accent); }
article blockquote {
  margin: 1.2em 0; padding: 12px 18px; border-left: 3px solid var(--marigold);
  background: var(--marigold-soft); border-radius: 0 8px 8px 0;
}
article blockquote p { margin: 0.4em 0; }
article code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
.codewrap { position: relative; margin: 1.2em 0; }
.codewrap pre {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; padding-top: 38px; overflow-x: auto; line-height: 1.55;
}
.codewrap pre code { background: none; padding: 0; font-size: 13.5px; white-space: pre; }
.copy {
  position: absolute; top: 8px; right: 8px; font-family: var(--font-ui); font-size: 12.5px;
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
}
.copy:hover { color: var(--accent); border-color: var(--accent); }
.tablewrap { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
article table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
article th, article td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
article th { font-family: var(--font-ui); font-weight: 600; font-size: 13.5px; color: var(--muted); background: var(--bg); }
article tr:last-child td { border-bottom: 0; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }

/* "Try it" and "Key takeaways" sections get a quiet panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 22px 14px; margin-top: 2em; }
.panel > h2 { border-top: 0; margin-top: 0.8em; padding-top: 0; font-size: 21px; }
.panel.try > h2 { color: var(--accent); }

.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); font-family: var(--font-ui); }
.pager a { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); max-width: 100%; }
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); font-size: 12px; }
.pager .next { margin-left: auto; text-align: right; }
.complete-row { display: flex; align-items: center; gap: 12px; margin-top: 36px; font-family: var(--font-ui); font-size: 14px; color: var(--muted); flex-wrap: wrap; }

@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  .brand span { display: none; }
  .brand b { font-size: 17px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 15; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0;
    width: min(320px, 88vw); height: auto; transform: translateX(-105%); transition: transform .2s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .side.open { transform: none; }
  main { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const MODULES = [{"id": "welcome", "file": "00-welcome.md", "room": "Lobby", "floor": "lobby", "short": "Welcome", "label": "Start here", "countable": false, "md": "# Welcome: Claude 101 and Beyond\n\nThis course is for people who have heard a lot about Claude, maybe tried it a few times, and want to get properly good at it. It's written for friends at HotelBFF, so the work examples lean toward hotels, travel, guests, and running a fast-moving company. Everything also applies to personal life.\n\n## Who this is for\n\n- **Complete beginners** who have never used an AI assistant seriously. Start at Module 1 and go in order.\n- **Casual users** who use Claude for the odd email and want more out of it. Skim Modules 1–2, then focus on 3, 6, 8 and 9.\n- **Power users and builders** who want agents, connectors, and the API. Jump to Track C (Modules 10–13).\n\n## How the course is organised\n\n| Track | Modules | What you'll be able to do |\n|---|---|---|\n| **A. Foundations (Claude 101)** | 1–5 | Understand what Claude is, set it up, write good prompts, work with files, and use it safely |\n| **B. Everyday leverage** | 6–9 | Use Projects, memory, and research; apply Claude across personal life and your job |\n| **C. Advanced** | 10–13 | Use advanced prompting, connect Claude to your tools, delegate multi-step work to agents, and build on the API |\n| **Capstone** | 14 | A 30-day habit plan and a one-page cheat sheet |\n\nThere is also a **[Prompt Library](prompt-library.md)** of copy-paste prompts for common personal and work tasks.\n\n## How to get the most out of it\n\n1. **Do the \"Try it\" exercises.** Reading about Claude is like reading about swimming. Each module has 2–4 short exercises; they take 5–15 minutes each.\n2. **Use your own real tasks.** The fastest way to learn is to bring something you actually need done this week.\n3. **Keep a \"wins\" note.** Each time Claude saves you time or improves your work, write one line about it. After two weeks you'll have a clear picture of where it helps you most.\n\n## A note on accuracy\n\nThis course was written in October 2026. Claude's apps change often: features get added, renamed, or moved around in the menus. The ideas here (how to brief Claude, how to check its work, when to use which feature) change slowly. The exact buttons change fast. If something looks different, check [support.claude.com](https://support.claude.com) or just ask Claude: \"Where do I find X in the Claude app?\"\n\nLet's start.\n"}, {"id": "m01", "file": "01-how-claude-works.md", "room": "101", "floor": "A", "short": "How Claude works", "label": "Foundations · Module 1", "countable": true, "md": "# Module 1: How Claude Actually Works\n\n**Track A · Foundations · ~20 minutes**\n\nYou don't need to understand the maths to drive a car well, but you do need to know that it has brakes and a fuel tank. This module covers the handful of facts about Claude that change how you use it.\n\n## What Claude is\n\nClaude is a **large language model (LLM)** made by Anthropic. It was trained on a very large amount of text (books, websites, code, and more) and then further trained to be helpful, honest, and careful. When you send it a message, it writes a response one small piece at a time, each piece chosen based on everything that came before it in the conversation.\n\nTwo consequences matter:\n\n- **Claude is very good at language tasks**: writing, summarising, explaining, translating, reasoning through problems, analysing documents, writing code, and following detailed instructions.\n- **Claude can sound confident and still be wrong.** It produces plausible text. Most of the time plausible and correct are the same thing. Sometimes they aren't, especially for specific facts, numbers, names, quotes, and recent events. This is called a **hallucination**. Module 5 covers how to manage it.\n\n## Six facts that change how you use it\n\n### 1. Claude only knows what's in the conversation (plus its training)\n\nClaude doesn't know who you are, what HotelBFF does, what you discussed yesterday, or what's in your inbox, unless:\n\n- you tell it in the chat,\n- you upload files or connect tools (Modules 4 and 11), or\n- you use features that carry context across chats, like **Projects** and **memory** (Module 6).\n\n**Most bad answers come from missing context, not from a weak model.** Treat Claude like a brilliant new colleague on their first day: smart, fast, eager, and missing all the background.\n\n### 2. It has a training cutoff\n\nClaude's built-in knowledge stops at a certain date. For anything recent (news, prices, new regulations, a competitor's latest launch), turn on **web search** or give it the source material yourself.\n\n### 3. The context window is its working memory\n\nEverything in a conversation (your messages, Claude's replies, uploaded files) has to fit in the **context window**. It's large (hundreds of pages of text), but not infinite. Very long chats can get slower, and older details can get less attention.\n\n**Practical rule:** one chat per task. When you switch topics, start a new chat. When a long chat gets messy, ask Claude to \"summarise everything we've decided so far\" and paste that summary into a fresh chat.\n\n### 4. It's not a search engine (unless you make it one)\n\nA search engine finds existing pages. Claude *generates* answers. That makes it much better for \"help me think through this\", \"draft this\", \"explain this\", and \"compare these\". Without web search turned on, it is worse for \"what is the exact current price of X\".\n\n### 5. It responds to how you ask\n\nThe same question asked two ways can get a mediocre answer or an excellent one. Detail, examples, and a clear goal all improve the output. Module 3 is entirely about this.\n\n### 6. It can do things, not just say things\n\nClaude can do more than chat. It can:\n\n- create documents, spreadsheets, slide decks, and small interactive apps (**Artifacts** and file creation),\n- search the web and run multi-step **Research**,\n- read and act in your connected tools like email, calendar, and drive (**Connectors**),\n- work through long, multi-step tasks on its own as an **agent** (Claude Code, Cowork, Claude in Chrome).\n\nThe later modules cover each of these.\n\n## The model family\n\nClaude comes in a few sizes. The names change with each generation, but the pattern holds:\n\n| Tier | Good for | Trade-off |\n|---|---|---|\n| **Opus** (largest) | Hard reasoning, complex writing, long agentic tasks, deep analysis | Slower; uses your usage limits faster |\n| **Sonnet** (balanced) | Most everyday work: writing, analysis, coding | Strong default for most people |\n| **Haiku** (smallest) | Quick, simple, high-volume tasks | Less depth on hard problems |\n\nAs of this writing the current family is Claude 5 (for example Opus 5.5, Sonnet 5.5 and Haiku 5.5). You'll see the exact names in the model picker. **Start with the default.** Switch to the most capable model when a task is hard or high-stakes, and to a faster one when you want speed.\n\nMany models also offer **extended thinking**: Claude reasons step by step before answering. Turn it on for maths, planning, tricky analysis, or decisions with many moving parts. Leave it off for quick tasks.\n\n## How Claude is designed to behave\n\nAnthropic trains Claude to be helpful, honest, and harmless. In practice:\n\n- It will tell you when it's unsure, if you let it. (\"If you don't know, say so\" is a useful line to add.)\n- It may push back or decline when asked to do something harmful or deceptive.\n- It aims to give balanced views on contested topics.\n- It is not a doctor, lawyer, or financial adviser. It can help you understand and prepare, and you should still confirm high-stakes decisions with a qualified person.\n\n## Try it\n\n1. **Test the context gap.** Ask Claude: *\"Write a welcome email for our new guests.\"* Then open a new chat and ask again, but first give it three sentences about a real or imagined property: its name, location, the kind of guest it attracts, and the tone you want. Compare the two results.\n2. **Test the cutoff.** Ask: *\"What's your knowledge cutoff, and what kinds of questions should I double-check because of it?\"*\n3. **Test thinking.** Give it a planning problem, such as *\"I have 3 days in Lisbon with a 6-year-old and a grandparent who can't walk far. Plan it.\"* Try it with extended thinking off and then on. Notice the difference in depth.\n\n## Key takeaways\n\n- Claude is a language model: excellent at language and reasoning, and capable of confident mistakes.\n- **Context is everything.** Give it the background a new colleague would need.\n- One chat per task. Use web search or your own sources for anything recent or exact.\n- Use bigger models and extended thinking for hard problems, and defaults for everything else.\n"}, {"id": "m02", "file": "02-getting-set-up.md", "room": "102", "floor": "A", "short": "Getting set up", "label": "Foundations · Module 2", "countable": true, "md": "# Module 2: Getting Set Up\n\n**Track A · Foundations · ~20 minutes**\n\n## Where Claude lives\n\nYou can reach the same Claude account from several places. Your chats and Projects sync between them.\n\n| Surface | Best for |\n|---|---|\n| **claude.ai (web)** | Everything; works on any computer |\n| **Desktop app (Mac/Windows)** | Daily use, a quick-launch shortcut, local file access, and agent features like Cowork |\n| **Mobile app (iOS/Android)** | On the go: voice conversations, photos of documents, quick questions |\n| **Claude in Chrome** | Letting Claude read and act on web pages in your browser |\n| **Claude in Slack, Excel, PowerPoint and other tools** | Using Claude inside the tools your team already works in |\n| **Claude Code** | Software work: reading, writing and running code (Module 12) |\n| **The API** | Building Claude into your own products and workflows (Module 13) |\n\n**Recommendation:** install the desktop app and the mobile app. Pin the desktop app and learn its keyboard shortcut so asking Claude becomes as quick as opening a search bar.\n\n## Plans in brief\n\n- **Free**: good for trying Claude out. Lower usage limits and fewer features.\n- **Pro / Max**: individual paid plans. Higher limits and access to the most capable models and advanced features. Max is for heavy users.\n- **Team / Enterprise**: for companies. Admin controls, shared Projects, connectors managed by the company, and by default your data is not used for model training.\n\nUsage limits reset over time windows. If you hit a limit, wait for the reset, switch to a smaller model, or start fresh chats instead of continuing very long ones (long chats use more of your allowance per message).\n\n> **For work:** check whether HotelBFF has a company Team or Enterprise workspace and use that for work tasks. Keep personal and work accounts separate.\n\n## A tour of the chat screen\n\nThe layout changes from time to time, but you'll find these controls:\n\n- **Message box**: where you type. Press Shift+Enter for a new line without sending.\n- **Attach (+ or paperclip)**: upload files and images, or add content from connected apps like Google Drive.\n- **Model picker**: choose which Claude model to use.\n- **Extended thinking**: tells Claude to reason more before answering.\n- **Search and tools menu**: turn on web search and Research, and enable connectors.\n- **Styles**: change how Claude writes (concise, explanatory, formal, or a custom style you create from your own writing samples).\n- **Projects** (sidebar): workspaces with their own instructions and files (Module 6).\n- **Artifacts**: the side panel where Claude shows documents, code, and mini-apps it creates (Module 4).\n- **Voice**: on mobile and desktop you can talk to Claude and hear answers.\n- **Incognito chat**: a chat that isn't saved to your history or used for memory.\n\n## Settings worth five minutes\n\nOpen **Settings** and look at:\n\n1. **Profile / personal preferences.** Tell Claude, once, things that should apply to every chat. For example:\n   > I work in operations at a hotel-tech startup in India. I prefer concise answers with bullet points, Indian English spelling, and amounts in INR unless I say otherwise. When you're unsure, say so.\n2. **Memory.** If available on your plan, decide whether Claude should remember things across chats. You can view and edit what it remembers.\n3. **Capabilities / features.** Make sure the features you want, such as artifacts, file creation, web search and code execution, are switched on.\n4. **Connectors.** See which apps you can connect (Gmail, Google Calendar, Google Drive, Slack, Notion and many more). Module 11 covers these properly.\n5. **Privacy.** Review the data and training settings so you know how your chats are handled.\n\n## Your first real conversation\n\nPick something from your actual week, such as an email you've been putting off, a decision you're stuck on, or a document you need to read. Then:\n\n1. **Give context:** who you are, what the situation is, and who it's for.\n2. **Say what you want:** a draft, a summary, options, or a critique.\n3. **Read the answer critically.**\n4. **Reply with feedback**, such as *\"shorter\"*, *\"more direct\"*, *\"the second option, but warmer\"*. Don't start over. Steering is the skill.\n\n## Try it\n\n1. Write your **profile preferences** in Settings (use the example above as a template).\n2. Install the **mobile app** and ask Claude something by voice while walking.\n3. Take a photo of something on paper, such as a menu, a bill, or a handwritten note, and ask Claude to turn it into a clean table.\n\n## Key takeaways\n\n- Same account everywhere: web, desktop, mobile, browser, and inside your tools.\n- Profile preferences save you from repeating yourself in every chat.\n- Use the company workspace for work and a personal account for personal life.\n- The core skill is iteration: ask, read, steer.\n"}, {"id": "m03", "file": "03-prompting-that-works.md", "room": "103", "floor": "A", "short": "Prompting that works", "label": "Foundations · Module 3", "countable": true, "md": "# Module 3: Prompting That Works\n\n**Track A · Foundations · ~35 minutes**\n\nThis is the most important module in the course. Prompting is not about magic words. **It is about briefing well.** If you can brief a smart colleague, you can prompt Claude.\n\n## The briefing mindset\n\nImagine handing a task to a sharp new hire who has never been to your office. What would they need to know to do it well on the first try? Usually:\n\n1. **Context.** Who you are, what's going on, and why this matters.\n2. **Task.** Exactly what you want done.\n3. **Audience and goal.** Who it's for and what a good result achieves.\n4. **Constraints.** Length, tone, format, things to avoid, deadlines.\n5. **Examples or materials.** Samples of what good looks like, or the source documents.\n\nYou don't need all five every time. A quick question needs none. But the more a task matters, the more of these you should include.\n\n## Before and after\n\n**Weak prompt**\n\n> Write a reply to a guest complaint.\n\n**Strong prompt**\n\n> I manage guest relations for a 40-room boutique hotel in Goa. A guest emailed (pasted below) complaining that their sea-view room had construction noise from 8am and the front desk was dismissive when they raised it.\n>\n> Write a reply that:\n> - apologises sincerely without making excuses,\n> - acknowledges both the noise and the poor response from our team,\n> - offers a complimentary night on a future stay or a 30% refund for the affected nights (their choice),\n> - is under 150 words, warm but professional, and signed \"Priya, Guest Relations\".\n>\n> Don't promise the construction will stop; we don't control it.\n>\n> Guest email:\n> \"\"\"\n> [paste]\n> \"\"\"\n\nThe second prompt takes 60 seconds more to write and saves three rounds of edits.\n\n## Ten techniques that work\n\n### 1. Be specific about the output\n\"Summarise this\" gives a random summary. \"Summarise this in 5 bullets for a CEO who has 30 seconds, leading with the decision needed\" gives a useful one.\n\n### 2. Give examples\nIf you want a particular style, show it. Paste two past emails you liked and say \"match this tone\". Examples beat adjectives.\n\n### 3. Explain *why*\n\"Keep it short **because** it'll be read on a phone in the lobby\" works better than \"keep it short\". When Claude knows the reason, it makes better judgment calls on everything you didn't specify.\n\n### 4. Separate instructions from material\nWhen you paste documents, put them inside clear markers such as triple quotes or tags like `<email>...<\/email>`. This stops Claude confusing your instructions with the content.\n\n### 5. Ask for options\n\"Give me 5 subject lines, from safe to bold\" beats asking for one and hoping. Then pick and refine.\n\n### 6. Let Claude ask questions first\nFor anything substantial, end with:\n> Before you start, ask me any questions you need answered to do this well.\n\nThis is the single best habit for complex tasks.\n\n### 7. Assign a perspective\n\"Review this pitch as a sceptical hotel owner who has been burned by tech vendors before\" gives a sharper critique than \"review this pitch\".\n\n### 8. Break big tasks into steps\nDon't ask for a whole business plan in one message. Ask for an outline, agree on it, then do each section. You keep control and the quality stays high.\n\n### 9. Tell it what to do, not only what to avoid\n\"Write in plain, conversational English\" works better than \"don't be formal\". Positive instructions are clearer.\n\n### 10. Iterate in the conversation\nThe first answer is a draft. Reply with specific feedback:\n- \"Good. Cut the second paragraph, and make the ending a clear ask.\"\n- \"Too salesy. Rewrite as if you're a helpful colleague, not a vendor.\"\n- \"Keep the structure, but change the examples to be about resorts, not city hotels.\"\n\n## Formats you can ask for\n\nClaude can give you almost any shape of output. Ask explicitly:\n\n- bullet points, numbered steps, or a table\n- a checklist\n- an email, WhatsApp message, LinkedIn post, or memo\n- a pros/cons comparison or a decision matrix with scores\n- a script for a call or a difficult conversation\n- a spreadsheet, document, or slide deck as a downloadable file (Module 4)\n- a one-page summary followed by details\n\n## A reusable template\n\nCopy this into your notes and fill it in for any important task:\n\n```\nContext: [who I am, the situation, why this matters]\nTask: [what I want you to do]\nAudience: [who will read/use this]\nGood looks like: [the goal, success criteria]\nConstraints: [length, tone, format, must-include, must-avoid]\nMaterials: [paste or attach]\nBefore you start, ask me anything you need to know.\n```\n\n## Common mistakes\n\n| Mistake | Fix |\n|---|---|\n| One-line prompts for important work | Add context and constraints |\n| Starting a new chat after a bad answer | Give feedback in the same chat instead |\n| Accepting the first answer | Ask for options or a critique: \"What's weak about this?\" |\n| Asking for everything at once | Break it into steps |\n| Pasting sensitive data without thinking | See Module 5 |\n| Treating facts as verified | Check names, numbers, and claims |\n\n## Try it\n\n1. **Rewrite a weak prompt.** Take this: *\"Make a social post about our monsoon offer.\"* Rewrite it using the template, then compare outputs.\n2. **Use the question trick.** Ask Claude to help you plan something real, such as a team offsite or a family trip, and end with \"ask me any questions first\".\n3. **Practice steering.** Get a draft of anything, then give three rounds of specific feedback. Notice how quickly it converges.\n4. **Get a critique.** Paste something you wrote recently and ask: *\"Critique this as [specific reader]. Be direct. What's unclear, weak, or missing?\"*\n\n## Key takeaways\n\n- Prompting is briefing. Context, task, audience, constraints, examples.\n- Explain *why*, show examples, and let Claude ask questions.\n- The first answer is a draft. Steer it with specific feedback.\n- Keep a personal template for important tasks.\n"}, {"id": "m04", "file": "04-files-and-making-things.md", "room": "104", "floor": "A", "short": "Files and making things", "label": "Foundations · Module 4", "countable": true, "md": "# Module 4: Files, Images, and Making Things\n\n**Track A · Foundations · ~25 minutes**\n\nClaude can read what you give it and make things you can use, not just text in a chat window.\n\n## Giving Claude things to read\n\nYou can attach:\n\n- **Documents**: PDFs, Word files, text, contracts, reports, menus, policies\n- **Spreadsheets and data**: CSV and Excel files\n- **Images**: screenshots, photos of receipts or whiteboards, charts, product photos\n- **Content from connected apps**: files from Google Drive and similar tools\n\n### What to do with documents\n\n- **Summarise:** \"Summarise this 40-page vendor contract. List the termination terms, auto-renewal clauses, liability caps, and anything unusual. Quote the exact clause numbers.\"\n- **Compare:** \"Here are three hotel PMS proposals. Compare them in a table: price, contract length, integrations, support terms, and red flags.\"\n- **Extract:** \"Pull every date and deadline from this document into a table.\"\n- **Question:** \"Based only on this policy document, can a guest get a refund if they cancel 24 hours before check-in?\"\n\n> **Tip:** Ask Claude to **quote** the parts of the document it relied on. This makes checking its work fast and reduces made-up details.\n\n### What to do with images\n\n- Screenshot an error message: \"What does this mean and how do I fix it?\"\n- Photograph a whiteboard after a meeting: \"Turn this into structured notes with action items.\"\n- Upload a competitor's landing page: \"What's this page doing well? What would you change?\"\n- Photograph a printed bill: \"Put these line items in a table and check the total.\"\n\n### What to do with data\n\nClaude can run analysis on spreadsheets and CSVs, including calculations and charts. For example:\n\n> Here's our booking export for last quarter (CSV). Show me:\n> 1. bookings and revenue by month,\n> 2. average length of stay by channel,\n> 3. cancellation rate by lead time bucket (0–7, 8–30, 31+ days),\n> and a chart for each. Then tell me the three most interesting patterns.\n\nAlways sanity-check numbers against something you know, such as last month's total. If a figure looks off, ask Claude to show how it calculated it.\n\n## Making things\n\n### Artifacts\n\nWhen Claude creates something substantial, such as a document, a piece of code, a diagram, or a small interactive app, it can appear as an **Artifact** in a panel next to the chat. You can keep editing it through conversation, copy it, download it, and publish it to share with others.\n\nThings people build with Artifacts:\n\n- a **checklist app** for a housekeeping inspection\n- an **ROI calculator** for a sales conversation\n- a **trip itinerary** page to share with family\n- a **training quiz** for new front-desk staff\n- a **flowchart** of a guest complaint escalation process\n- a simple **dashboard** from a spreadsheet you uploaded\n\nYou don't need to know how to code. Describe what you want, try it, then ask for changes: *\"Add a button to reset the form\"*, *\"Make it work on mobile\"*, *\"Use our brand colours: navy and coral.\"*\n\n### Real files\n\nClaude can also create proper files you download and open in other apps:\n\n- **Word documents** (proposals, SOPs, letters)\n- **Excel spreadsheets** with working formulas (budgets, trackers, models)\n- **PowerPoint decks** (pitches, training, monthly reviews)\n- **PDFs**\n\nExample:\n\n> Create an Excel budget for a 3-day team offsite for 25 people in Udaipur. Tabs for travel, stay, food, activities, and a summary tab with totals and per-person cost. Use formulas so I can change headcount and everything updates.\n\n## Try it\n\n1. **Document Q&A.** Upload a long PDF you've been meaning to read, like a policy, report, or contract. Ask for a 5-bullet summary, then three specific questions. Ask it to quote its sources in the document.\n2. **Image to structure.** Photograph a page of handwritten notes or a whiteboard and turn it into a clean action list.\n3. **Build a mini-app.** Ask: *\"Build me an interactive checklist for a hotel room inspection, with sections for bathroom, bed, minibar, and amenities, a pass/fail toggle for each item, and a score at the bottom.\"* Then ask for two improvements.\n4. **Make a real file.** Ask for a spreadsheet you'd actually use, such as a monthly personal budget or a trip cost splitter.\n\n## Key takeaways\n\n- Upload the real material instead of describing it. Claude reads documents, images, and data.\n- Ask Claude to quote or show its working so you can verify quickly.\n- Artifacts turn ideas into usable tools and documents in minutes, without code.\n- Claude can produce real Word, Excel, PowerPoint, and PDF files.\n"}, {"id": "m05", "file": "05-accuracy-privacy-judgment.md", "room": "105", "floor": "A", "short": "Accuracy, privacy, judgment", "label": "Foundations · Module 5", "countable": true, "md": "# Module 5: Accuracy, Privacy, and Judgment\n\n**Track A · Foundations · ~20 minutes**\n\nClaude is a powerful tool. Like any powerful tool, you get the most from it when you know where it can go wrong.\n\n## Accuracy: trust, but verify\n\n### Where Claude is reliable\n\n- Explaining concepts, structuring thinking, brainstorming\n- Rewriting, editing, and changing tone\n- Summarising material **you provided**\n- Following a format or process you defined\n- Reasoning through problems step by step\n\n### Where to double-check\n\n- **Specific facts**: names, dates, statistics, prices, laws, quotes\n- **Recent events**: anything after its training cutoff, unless web search is on\n- **Citations and links**: always click through and confirm the source says what Claude claims\n- **Maths in long chains**: ask it to show its working, or to use code for calculations\n- **Niche or local details**: a specific regulation in one state, a small company, a local vendor\n\n### Habits that reduce errors\n\n1. **Give it the source.** \"Based only on the attached document...\" beats relying on its memory.\n2. **Ask it to flag uncertainty.** \"If you're not sure about something, say so explicitly rather than guessing.\"\n3. **Ask for quotes and sources.** Then spot-check them.\n4. **Use web search or Research** for current or verifiable facts (Module 7).\n5. **Ask for a self-check.** \"Review your answer for errors or unsupported claims.\" It often catches its own mistakes.\n6. **Match checking effort to stakes.** A birthday message needs no checking. A contract clause, a medical question, or a number going to investors needs a real check by you or an expert.\n\n## Privacy: think before you paste\n\n### General rules\n\n- **Follow your company's AI policy.** If HotelBFF has one, it wins over anything here.\n- **Use the right account.** Company work goes in the company workspace (Team/Enterprise), which has business data protections. Don't put work data in a personal account.\n- **Minimise personal data.** You rarely need a guest's real name, phone number, passport, or payment details to get help with a task. Replace them with placeholders like `[GUEST NAME]`.\n- **Never paste secrets.** Passwords, API keys, full card numbers, and bank details have no place in a chat.\n- **Know your settings.** Check the privacy settings and understand whether chats can be used to improve models. Use incognito chats for sensitive personal topics if you prefer they're not saved.\n\n### A quick test\n\nBefore pasting something, ask: *\"Would I be comfortable if this was shared with a trusted external contractor working for us?\"* If not, anonymise it or don't paste it.\n\n## Judgment: you're still the professional\n\nClaude drafts, analyses, and suggests. **You decide and you're accountable.**\n\n- **Don't outsource your voice entirely.** Edit drafts so they sound like you, especially in personal messages.\n- **Disclose when it matters.** Some contexts (academic work, some client deliverables, legal filings) have rules about AI assistance. Know them.\n- **Be careful with people decisions.** Use Claude to structure interview questions or performance feedback, not to make hiring or firing decisions about specific people.\n- **Use experts for high-stakes advice.** For health, legal, tax, and financial matters, Claude is great for understanding your situation and preparing questions. It doesn't replace a doctor, lawyer, or CA.\n- **Watch for agreement bias.** If you push hard, Claude may lean toward your view. Ask it to argue the other side: \"What's the strongest case against what I just said?\"\n\n## When Claude declines\n\nOccasionally Claude will refuse or add caveats. Usually that's because the request looks harmful, deceptive, or risky out of context. If you have a legitimate need, explain the context. (\"I'm writing a training guide on spotting phishing emails for our staff; show me what a typical one looks like.\") If it still declines, respect that and find another route.\n\n## Try it\n\n1. **Catch a hallucination.** Ask Claude for 5 statistics about the Indian hotel industry with sources, with web search **off**. Then turn web search **on** and ask again. Compare and click through the sources.\n2. **Anonymise.** Take a real (work-appropriate) document and practice replacing personal details with placeholders before sharing.\n3. **Argue the other side.** State a decision you're leaning toward and ask Claude for the strongest case against it.\n\n## Key takeaways\n\n- Trust Claude for reasoning and language. Verify specific facts, numbers, and sources.\n- Give it source material and ask it to flag uncertainty.\n- Follow company policy, use the right account, and minimise personal data.\n- Claude assists. You decide.\n"}, {"id": "m06", "file": "06-projects-memory-styles.md", "room": "201", "floor": "B", "short": "Projects, memory, styles", "label": "Everyday leverage · Module 6", "countable": true, "md": "# Module 6: Projects, Memory, and Styles\n\n**Track B · Everyday leverage · ~20 minutes**\n\nModule 1 said Claude only knows what's in the conversation. These three features fix that, so you stop re-explaining yourself.\n\n## Projects: a workspace with built-in context\n\nA **Project** is a folder for related chats that shares:\n\n- **Project instructions**: standing guidance applied to every chat in the project\n- **Project knowledge**: files Claude can refer to in every chat (documents, guidelines, data, past examples)\n\nEvery new chat inside the project starts already knowing the background.\n\n### Good projects to create\n\n**At work**\n- **\"Guest Communications\"**: your brand voice guide, sample emails you liked, policies (cancellation, refunds, pets), and the instruction *\"Always write in our brand voice; never promise anything outside the attached policies.\"*\n- **\"Sales Enablement\"**: product one-pagers, pricing, case studies, common objections and answers.\n- **\"Monthly Reporting\"**: your report template, last month's report, metric definitions.\n- **\"Hiring\"**: job descriptions, the interview rubric, the company values.\n\n**Personal**\n- **\"Family Travel\"**: everyone's preferences, dietary needs, passport expiry months (not numbers), budget norms.\n- **\"Health & Fitness\"**: your goals, routines, and constraints (and the reminder that it's not medical advice).\n- **\"Learning Spanish\"** (or anything): your level, goals, and instructions to quiz you.\n\n### Writing good project instructions\n\nKeep them short and specific. For example:\n\n```\nYou are helping the HotelBFF partnerships team.\n- Audience: independent hotel owners in India, often not tech-savvy.\n- Tone: friendly, plain English, no jargon, no hype.\n- Always use the attached pricing sheet; never invent prices or discounts.\n- When drafting outreach, keep emails under 120 words with one clear ask.\n- If information is missing, ask rather than assume.\n```\n\n### Sharing projects\n\nOn Team and Enterprise plans you can share projects with colleagues. A well-built shared project captures the team's best practices: new joiners get the same quality output as veterans from day one.\n\n## Memory: Claude remembers you across chats\n\nWith **memory** enabled (availability depends on your plan), Claude can remember useful things from past conversations, such as your role, ongoing projects, and preferences, and use them in later chats. You can also ask it to search past chats: *\"What did we decide about the offsite venue last week?\"*\n\n**You're in control:**\n- See and edit what Claude remembers in Settings.\n- Tell it directly: *\"Remember that I prefer answers in bullet points.\"* or *\"Forget what I told you about X.\"*\n- Use **incognito chats** for conversations you don't want remembered.\n- Memory is kept separate per project, so work context doesn't leak into personal projects.\n\n## Styles: how Claude writes\n\n**Styles** change the voice and format of Claude's responses: more concise, more explanatory, more formal, or a **custom style**. You can create one by uploading samples of your own writing. Claude then drafts in a way that sounds more like you.\n\nGood uses:\n- a \"My emails\" style trained on 3–5 emails you've written\n- a \"Board update\" style that's tight, numeric, and leads with decisions\n- a \"Teach me\" style that explains step by step with examples\n\n## Profile preferences vs. projects vs. memory vs. styles\n\n| Feature | Scope | Use it for |\n|---|---|---|\n| **Profile preferences** | Every chat | Who you are and universal preferences (language, units, format) |\n| **Project instructions and knowledge** | Chats in that project | Task-specific rules and reference documents |\n| **Memory** | Across chats (per project) | Things learned over time from your conversations |\n| **Styles** | When selected | How the writing sounds |\n\n## Try it\n\n1. **Build one work project** for a task you repeat every week. Add instructions plus 2–3 reference files. Run your next three instances of that task inside it.\n2. **Build one personal project** (travel, fitness, learning, or home).\n3. **Create a custom style** from three emails you've written. Draft a new email with it and compare it to the default.\n4. If memory is on, ask: *\"What do you remember about me?\"* Edit anything that's wrong.\n\n## Key takeaways\n\n- Projects give Claude standing context and files, so you stop repeating yourself.\n- Short, specific project instructions beat long, vague ones.\n- Memory carries context across chats. You can see it, edit it, and turn it off.\n- Styles make the writing sound the way you want, including like you.\n"}, {"id": "m07", "file": "07-research-and-web-search.md", "room": "202", "floor": "B", "short": "Research and web search", "label": "Everyday leverage · Module 7", "countable": true, "md": "# Module 7: Research and Web Search\n\n**Track B · Everyday leverage · ~15 minutes**\n\n## Web search\n\nWith **web search** on, Claude can look things up online and cite its sources. Use it for:\n\n- anything recent: news, launches, regulation changes, prices\n- facts you want backed by a source\n- comparisons of current products, services, or vendors\n- local information: opening hours, events, travel rules\n\nClaude adds citations to its answer. **Click a couple of them.** Sources can be outdated or low quality, and occasionally a summary misreads the source.\n\n## Research mode\n\n**Research** is a deeper mode. Claude runs many searches, reads widely, and comes back with a structured report and citations. It takes longer (often several minutes) and is worth it for questions like:\n\n- *\"What are the main channel-manager and booking-engine options for independent hotels in India? Compare pricing models, integrations, and what reviewers complain about.\"*\n- *\"Summarise the regulatory requirements for running a homestay in Kerala, with official sources.\"*\n- *\"What has changed in Google Hotel Ads over the last 12 months, and what does it mean for small hotels?\"*\n- *\"I'm deciding between three schools for my daughter. Research each one's curriculum, reviews, fees, and commute from [area].\"*\n\nIf you connect your work tools (Module 11), Research can also look through your email, documents, and calendar alongside the web.\n\n## Writing good research questions\n\nWeak: *\"Tell me about hotel tech.\"*\n\nStrong:\n> I'm preparing a 10-minute talk for hotel owners about AI in guest communication. Research:\n> 1. what AI tools independent hotels are actually using for guest messaging today,\n> 2. evidence (studies or credible surveys) about impact on response time, reviews, or revenue,\n> 3. common failures or guest complaints.\n>\n> Prioritise sources from the last 18 months. Flag where evidence is weak. Output a 1-page summary followed by details with sources.\n\nThe ingredients: **purpose, specific sub-questions, time window, source quality, and output format.**\n\n## Turning research into action\n\nResearch is a starting point. Follow up in the same chat:\n\n- *\"Turn this into a 5-slide deck outline.\"*\n- *\"Which three findings matter most for a 30-room property? Why?\"*\n- *\"Draft an email to my team summarising this with a recommendation.\"*\n- *\"What are the weakest claims in this report? Which sources would you double-check?\"*\n\n## Try it\n\n1. Turn on web search and ask about something that happened this month in your industry. Check two citations.\n2. Run a **Research** query on a real decision you're facing, at work or at home, using the strong-question pattern above.\n3. Ask Claude to critique its own report: *\"Which parts of this are least reliable?\"*\n\n## Key takeaways\n\n- Web search for current facts; Research for deep, multi-source questions.\n- Always click through a few citations.\n- Good research prompts specify purpose, sub-questions, time window, and format.\n- Follow up to turn research into decisions and deliverables.\n"}, {"id": "m08", "file": "08-claude-in-personal-life.md", "room": "203", "floor": "B", "short": "Claude in personal life", "label": "Everyday leverage · Module 8", "countable": true, "md": "# Module 8: Claude in Your Personal Life\n\n**Track B · Everyday leverage · ~25 minutes**\n\nClaude is just as useful outside work. This module is a set of plays: situations where it reliably helps, with a starter prompt for each.\n\n## Planning and logistics\n\n**Trip planning**\n> Plan a 5-day trip to Sri Lanka in December for two adults who like food, short hikes, and beaches but hate long drives (max 3 hours a day). Mid-range budget, about ₹1.5 lakh total excluding flights. Give a day-by-day plan, where to stay each night, and what to book in advance. Ask me questions first.\n\n**Events**\n> Help me plan my parents' 35th anniversary dinner for 20 people at home. Create a timeline for the 2 weeks before, a shopping list, a menu with 2 vegetarian and 1 Jain-friendly option, and a task split for me and my two siblings.\n\n**Weekly routines**\n> Here's what my week looks like [paste]. Help me design a realistic weekly routine that includes 3 workouts, 2 evenings with no screens, and time for my side project. Be realistic. I usually overcommit.\n\n## Money (understand, then decide)\n\n> Explain the difference between the old and new income tax regimes in India for a salaried person earning ₹18 lakh with a home loan. Use a table. Tell me what documents and numbers I should take to my CA to decide.\n\n> Here's my last 3 months of spending, exported from my bank app (CSV). Categorise it, show where the money goes, and suggest 3 realistic changes. Don't lecture me.\n\n*Remember: Claude helps you understand. For actual tax filing and investment decisions, confirm with a qualified professional.*\n\n## Health and wellbeing (prepare, don't diagnose)\n\n> I have a doctor's appointment about recurring migraines. Help me prepare: what information should I track for the next two weeks, and what questions should I ask the doctor?\n\n> Translate this lab report into plain English. What do the flagged values mean in general, and what should I ask my doctor about? [attach]\n\n> Create a 4-week beginner running plan for someone who can currently jog 10 minutes. 3 days a week, and I have a sensitive knee.\n\n## Learning anything\n\nClaude is a patient, always-available tutor.\n\n> Teach me the basics of investing in index funds. Start by asking what I already know. Explain one concept at a time, check my understanding with a question, and only move on when I get it right.\n\n> I'm learning Spanish (beginner). Have a simple conversation with me about ordering food. Correct my mistakes gently after each message.\n\n> Explain how airline pricing works like I'm smart but have no background in it. Then give me 3 practical tips for booking flights.\n\n## Writing and communication\n\n**Hard conversations**\n> I need to tell my landlord I'm moving out 2 months earlier than the lease says. Help me write a message that's polite, firm, and proposes a solution (I'll help find a new tenant). Then help me prepare for the likely pushback.\n\n**Messages that matter**\n> Help me write a heartfelt wedding speech for my best friend. Ask me for 5 stories or details first, then draft a 3-minute speech that's funny but ends warmly.\n\n**Admin**\n> Draft a complaint to my broadband provider. Outages on these dates [list], 3 support tickets with no fix. I want a bill credit and a technician visit within 48 hours.\n\n## Decisions\n\n> I'm deciding between two job offers [details]. Help me think it through: ask about what I value most, then build a weighted decision matrix. After that, argue for the option I'm *not* leaning toward.\n\n> We're thinking of buying a car vs. continuing with cabs. Here's our usage [details]. Do a 5-year cost comparison, and list the non-financial factors.\n\n## Home and family\n\n- **Cooking:** \"Here's what's in my fridge [photo]. Give me 3 dinner options under 30 minutes.\"\n- **Kids:** \"My 8-year-old asked why the sky is blue. Help me explain it with an experiment we can do at home.\"\n- **Fixing things:** \"Here's a photo of my leaking tap. What's probably wrong, and can I fix it myself?\"\n- **Gifts:** \"Gift ideas for my father (62, loves gardening and old Hindi films), budget ₹5,000.\"\n\n## Make it a habit\n\n- Keep the **mobile app** handy. Voice mode is great for thinking out loud on walks.\n- Create a few **personal projects** (Module 6) so Claude knows your family, preferences, and goals.\n- Use **web search** for anything with prices, opening hours, or rules.\n\n## Try it\n\nPick three plays from this module that match something in your life *this week* and run them for real.\n\n## Key takeaways\n\n- Claude helps across planning, money, health, learning, writing, decisions, and home.\n- For money, health, and law: use Claude to understand and prepare, then confirm with a professional.\n- Asking Claude to ask you questions first makes personal plans fit your life.\n"}, {"id": "m09", "file": "09-claude-at-work.md", "room": "204", "floor": "B", "short": "Claude at work", "label": "Everyday leverage · Module 9", "countable": true, "md": "# Module 9: Claude at Work\n\n**Track B · Everyday leverage · ~30 minutes**\n\nThis module is a playbook by role, with examples from hotels, travel, and startups. Find your role, try the plays, and steal from the other roles too.\n\n## The universal plays (everyone)\n\n| Play | Starter prompt |\n|---|---|\n| **Inbox triage** | \"Here are 12 emails [paste]. Group them into: needs reply today, can wait, FYI only. Draft replies for the first group.\" |\n| **Meeting prep** | \"I'm meeting [person/company] about [topic]. Here's what I know [paste]. Give me the 3 goals I should have, likely objections, and 5 good questions.\" |\n| **Meeting notes to actions** | \"Here's the transcript [paste]. Give me decisions, action items with owners and dates, and open questions.\" |\n| **Write it shorter** | \"Cut this to half the length without losing any decision or number.\" |\n| **Explain it to me** | \"Explain [concept/document] to me like I'm new to the industry, then quiz me with 3 questions.\" |\n| **Get unstuck** | \"I'm stuck on [problem]. Ask me 5 questions to clarify it, then suggest 3 approaches.\" |\n| **Second opinion** | \"Review this [plan/doc] as a sceptical senior colleague. What would you push back on?\" |\n\n## Operations\n\n- **SOPs**: \"Turn this messy description of our check-in process [paste] into a clear SOP with steps, owners, and what to do when things go wrong.\"\n- **Checklists**: \"Create a pre-arrival checklist for VIP guests at a 60-room business hotel.\"\n- **Incident reviews**: \"Here's what happened during last night's overbooking [notes]. Write a blameless incident review: timeline, root cause, what went well, what to change.\"\n- **Vendor comparison**: \"Compare these 3 laundry vendor quotes [attach] in a table and flag hidden costs.\"\n- **Staff training**: \"Create a 15-minute training session for front-desk staff on handling late check-out requests, with 3 role-play scenarios.\"\n\n## Guest experience and support\n\n- **Reply drafting**: use a **Project** with your policies and brand voice (Module 6) so every draft is on-policy.\n- **Review analysis**: \"Here are 200 recent reviews [CSV]. What are the top 5 praise themes and top 5 complaint themes, with example quotes and rough frequency? What should we fix first?\"\n- **Review responses**: \"Draft responses to these 5 reviews. Thank, acknowledge specifics, don't be defensive, invite them back. Under 80 words each.\"\n- **Multilingual**: \"Translate this pre-arrival message into Hindi, Tamil, German, and French, keeping the warm tone.\"\n- **FAQ building**: \"From these 50 guest questions [paste], build an FAQ page with clear, short answers using our policies [attach].\"\n\n## Sales and partnerships\n\n- **Prospect research**: \"Research [hotel/group] with web search: size, locations, recent news, likely priorities, and who to contact. Then suggest an angle for our outreach.\"\n- **Outreach**: \"Write a 3-email sequence to independent hotel owners about [product]. Plain language, one clear ask per email, no hype.\"\n- **Objection handling**: \"Here are the 10 objections we hear most [list]. Write a short, honest response to each, and when to walk away.\"\n- **Proposal drafting**: \"Using this template and these call notes, draft a proposal for [client].\"\n- **Call debrief**: \"Here are my call notes. Update the deal summary: needs, decision makers, timeline, risks, next steps.\"\n\n## Marketing\n\n- **Campaign ideas**: \"Give me 10 monsoon-season campaign ideas for boutique hotels in Kerala, from safe to bold. Include the target guest and the channel.\"\n- **Content**: \"Turn this blog post into 5 LinkedIn posts, 3 Instagram captions, and a newsletter section.\"\n- **SEO**: \"Suggest 20 search terms travellers might use to find a pet-friendly stay near Bangalore, grouped by intent.\"\n- **Brand consistency**: build a **Project** or **Skill** (Module 11) with your brand guide so all content matches it.\n- **Positioning**: \"Here are our homepage and two competitors' [paste]. How are we positioned differently? What's unclear about ours?\"\n\n## Revenue, finance, and analytics\n\n- **Data analysis**: upload booking or revenue exports. \"Show ADR, occupancy, and RevPAR by month and by channel. What changed most versus last year, and what might explain it?\"\n- **Spreadsheet help**: \"Write an Excel formula that flags bookings where the rate is more than 20% below the seasonal BAR in column F.\"\n- **Forecast thinking**: \"Here's our last 2 years of monthly occupancy. Suggest a simple forecasting approach and its limitations.\"\n- **Reporting**: \"Turn these numbers into a one-page monthly business review with 3 highlights, 3 concerns, and recommended actions.\"\n\n*Always cross-check key numbers against your source system before they go to leadership or investors.*\n\n## Product, tech, and design\n\n- **Specs**: \"Turn this feature idea into a one-page spec: problem, users, goals, non-goals, user stories, success metrics, open questions.\"\n- **User research**: \"Here are 15 interview notes. Synthesise the themes, ranked by frequency and severity, with quotes.\"\n- **Prototypes**: build clickable mock-ups as **Artifacts** to test ideas before engineering time is spent.\n- **Engineering**: use **Claude Code** (Module 12) to read, write, test, and review code across your repositories.\n\n## People and hiring\n\n- **Job descriptions**: \"Write a JD for a Guest Experience Manager. Make it honest about the pace of a startup and include what success looks like at 90 days.\"\n- **Interview kits**: \"Create structured interview questions and a scoring rubric for this role.\"\n- **Feedback**: \"Help me turn these notes into clear, kind, specific feedback using the situation-behaviour-impact format.\"\n- **Onboarding**: \"Create a 30-60-90 day onboarding plan for a new sales hire.\"\n\n*Use Claude to structure people processes, not to decide about specific individuals.*\n\n## Founders and leaders\n\n- **Thinking partner**: \"Here's our situation and three options [details]. Pressure-test each: what has to be true for it to work, and what are the biggest risks?\"\n- **Investor updates**: \"Turn these metrics and notes into a monthly investor update: highlights, lowlights, metrics table, asks.\"\n- **Board and strategy docs**: \"Critique this strategy memo as a board member. What's unclear, unsupported, or missing?\"\n- **Communication**: \"Help me announce [change] to the team. Be honest about why, address likely worries, and keep it under 250 words.\"\n\n## How to roll this out across a team\n\n1. **Start with one repeated task per person.** Not everything at once.\n2. **Build shared Projects** with the team's best prompts, policies, and examples.\n3. **Share wins** in a team channel: the prompt, the result, the time saved.\n4. **Agree on rules**: what data can go in, what needs human review, what must be disclosed.\n5. **Turn proven workflows into Skills or connected workflows** (Track C).\n\n## Try it\n\n1. Pick **two plays from your role** and one from another role, and run them on real work this week.\n2. Track time saved in your wins note.\n3. Share the best prompt with a colleague.\n\n## Key takeaways\n\n- Every role has high-value plays. Start with the tasks you repeat weekly.\n- Projects with policies and examples keep output consistent and on-brand.\n- Check numbers and facts before they leave your hands.\n- Roll out as a team: shared projects, shared wins, shared rules.\n"}, {"id": "m10", "file": "10-advanced-prompting.md", "room": "301", "floor": "C", "short": "Advanced prompting", "label": "Advanced · Module 10", "countable": true, "md": "# Module 10: Advanced Prompting\n\n**Track C · Advanced · ~30 minutes**\n\nModule 3 covered the basics of briefing. These techniques help with complex, long, or high-stakes work, and they are the foundation for building workflows and agents.\n\n## 1. Structure long prompts with tags\n\nWhen a prompt has several parts (instructions, documents, examples), label them with XML-style tags. Claude is trained to pay attention to this structure.\n\n```\n<context>\nWe're a hotel-tech startup preparing for a partner summit.\n<\/context>\n\n<documents>\n  <document name=\"last_year_feedback.csv\">...<\/document>\n  <document name=\"agenda_draft.md\">...<\/document>\n<\/documents>\n\n<task>\nPropose 3 changes to the agenda based on last year's feedback.\n<\/task>\n\n<output_format>\nFor each change: the change, the feedback that supports it (quote), and the expected impact.\n<\/output_format>\n```\n\nYou can also ask Claude to put parts of its output in tags, which makes it easy to pull out pieces later:\n> Put your reasoning in `<analysis>` tags and your final recommendation in `<recommendation>` tags.\n\n## 2. Put long documents first, the question last\n\nWith very long inputs (several reports or a big contract), paste the documents at the **top** and put your instructions and question at the **end**. This tends to produce better answers on long material.\n\nFor better accuracy, ask Claude to **extract relevant quotes first**, then answer based on those quotes:\n> First, find the quotes from the contract that are relevant to termination and put them in `<quotes>` tags. Then answer my question using only those quotes.\n\n## 3. Ask for reasoning before the answer\n\nFor analysis and decisions, ask Claude to think through the problem before concluding:\n> Think through this step by step: list the factors, weigh them, consider what could go wrong, and then give your recommendation.\n\nOr turn on **extended thinking**, which does this automatically. Don't over-specify *how* it should think. A high-level instruction to think carefully often works better than a rigid script.\n\n## 4. Few-shot examples\n\nShow 2–5 examples of input → output, and Claude will follow the pattern closely. This is powerful for classification and consistent formatting.\n\n```\nClassify each guest message as BOOKING, COMPLAINT, REQUEST, or OTHER.\n\nMessage: \"Can I get an extra pillow in 304?\" → REQUEST\nMessage: \"The AC has been broken since we arrived.\" → COMPLAINT\nMessage: \"Do you have rooms on the 14th for 2 nights?\" → BOOKING\n\nNow classify:\n[messages]\n```\n\nMake examples varied so Claude learns the underlying pattern, not one surface detail.\n\n## 5. Prompt chaining\n\nSplit a big job into a pipeline where each step's output feeds the next. For example, a competitor analysis:\n\n1. **Research** → \"Gather facts on these 5 competitors.\" (web search)\n2. **Structure** → \"Put the facts into this comparison table.\"\n3. **Analyse** → \"Identify gaps and opportunities for us.\"\n4. **Write** → \"Draft a 1-page memo for leadership.\"\n5. **Review** → \"Critique the memo as a sceptical CFO, then revise.\"\n\nEach step is easier to check and fix than one giant prompt.\n\n## 6. Self-critique and revision\n\nAsk Claude to grade its own work against explicit criteria:\n> Here are the criteria: clear ask in the first line, under 120 words, no jargon, mentions the customer's specific situation. Score your draft against each one, then rewrite to fix any misses.\n\n## 7. Write a prompt with Claude\n\nWhen you need a reusable prompt (for a Project, a Skill, or the API), ask Claude to help write it:\n> I want a reusable prompt that turns raw guest reviews into a weekly summary for hotel GMs. Interview me about what the GMs need, then write the prompt. Include an example output.\n\nThen test it on 5–10 real inputs and refine. **Prompting is iterative engineering**: write, test, look at failures, adjust.\n\n## 8. Be explicit about effort and scope\n\nModern Claude models follow instructions precisely. If you want more, ask for it:\n- \"Be thorough. Cover edge cases, not just the happy path.\"\n- \"Go beyond the basics. Include advanced options.\"\n\nIf you want less:\n- \"Just the answer, no explanation.\"\n- \"Only change what I asked for; leave everything else as is.\"\n\n## 9. Control format positively\n\nTo get prose instead of bullets, say \"write in flowing paragraphs\" rather than \"don't use bullet points\". Matching your own prompt's style to the output you want also helps: a prompt written in paragraphs tends to produce paragraphs.\n\n## 10. Build a test set for anything you reuse\n\nIf a prompt will run many times (on every guest review, every lead, every invoice), collect 10–20 real examples, including tricky ones. Check the outputs whenever you change the prompt. This simple habit is what separates a reliable workflow from a demo.\n\n## Try it\n\n1. **Tags.** Rewrite a complex prompt you've used, with `<context>`, `<documents>`, `<task>`, and `<output_format>` tags. Compare results.\n2. **Quotes first.** Take a long document and use the \"extract quotes, then answer\" pattern.\n3. **Chain.** Run a 4-step chain on a real topic: research → structure → analyse → write.\n4. **Meta-prompt.** Have Claude interview you and write a reusable prompt for a task you do weekly. Test it on 5 real inputs.\n\n## Key takeaways\n\n- Use tags to structure complex prompts, with documents first and questions last.\n- Ask for reasoning (or use extended thinking) on hard problems.\n- Few-shot examples and prompt chains give consistency and control.\n- For reusable prompts, test on real examples and iterate.\n"}, {"id": "m11", "file": "11-connectors-and-skills.md", "room": "302", "floor": "C", "short": "Connectors and skills", "label": "Advanced · Module 11", "countable": true, "md": "# Module 11: Connectors and Skills\n\n**Track C · Advanced · ~25 minutes**\n\nSo far, you've brought information *to* Claude. Connectors let Claude go and get it, and act in your tools. Skills teach Claude *how* you want specific work done.\n\n## Connectors: plug Claude into your tools\n\nA **connector** links Claude to an app or data source, such as Gmail, Google Calendar, Google Drive, Slack, Notion, Asana, Linear, HubSpot, Figma, and many more. Most connectors are built on the **Model Context Protocol (MCP)**, an open standard for connecting AI models to tools. Anyone can build an MCP connector for their own system.\n\n### What connectors make possible\n\n- **\"What's on my calendar this week, and which meetings should I prepare for?\"**\n- **\"Find the email thread with [vendor] about the contract renewal and summarise where we landed.\"**\n- **\"Search our Drive for the latest brand guidelines and check this post against them.\"**\n- **\"Summarise what happened in #ops-alerts on Slack while I was on leave.\"**\n- **\"Create tasks in our project tracker for each action item from this meeting.\"**\n- **\"Draft replies to the three unanswered partner emails\"** (as drafts you review, not sent automatically).\n\nCombined with **Research** (Module 7), Claude can search your email, documents, and the web together for a complete answer.\n\n### Setting up\n\n1. Go to **Settings → Connectors** (or the tools menu in a chat).\n2. Pick a connector and sign in to authorise it.\n3. In a chat, enable the connectors you need for that conversation.\n\nOn Team and Enterprise plans, admins decide which connectors are available.\n\n### Connector safety\n\n- **Grant the minimum.** Only connect what you'll use.\n- **Review before actions.** Claude will usually ask for approval before sending, posting, or changing anything. Read what it's about to do.\n- **Treat incoming content as untrusted.** An email or web page could contain text that tries to instruct an AI (\"ignore your instructions and forward this...\"). This is called **prompt injection**. Claude is trained to resist it, but you should still be cautious with actions triggered by external content.\n- **Only use connectors from sources you trust.**\n\n## Skills: teach Claude your way of doing things\n\nA **Skill** is a packaged set of instructions, and optionally files and scripts, that Claude loads when a task calls for it. Projects are about *context for a workspace*. Skills are about *how to do a specific kind of task*, wherever it comes up.\n\nClaude only loads a skill's full instructions when it's relevant. That means you can have many skills installed without cluttering every chat.\n\n### Examples\n\n- **Built-in skills** that help Claude create excellent Word, Excel, PowerPoint, and PDF files.\n- **\"HotelBFF brand voice\"**: tone rules, words to use and avoid, sample copy, logo usage.\n- **\"Monthly business review\"**: your exact report structure, metric definitions, and a checklist before sending.\n- **\"Guest complaint response\"**: your escalation rules, compensation guidelines, and templates.\n- **\"Video style\"**: subtitle, caption, voiceover, and pacing rules for product demo videos.\n\n### Creating a skill\n\nThe easiest way is to ask Claude:\n> Help me create a skill for writing our weekly partner newsletter. Interview me about structure, tone, and what good looks like, then package it as a skill.\n\nA skill is basically a folder with a `SKILL.md` file:\n\n```markdown\n---\nname: partner-newsletter\ndescription: Write the weekly HotelBFF partner newsletter. Use when asked to draft, edit, or review the partner newsletter.\n---\n\n# Partner newsletter\n\n## Structure\n1. One-line headline about the most important update\n2. \"What's new\" (max 3 items, 2 sentences each)\n3. \"Tip of the week\" for hotel owners\n4. One clear call to action\n\n## Tone\nFriendly, practical, no jargon. Write for a busy owner reading on WhatsApp.\n\n## Before finishing\n- Every claim about a feature matches the attached release notes\n- Under 300 words\n```\n\nThe **description** matters most: it's how Claude decides when to use the skill. Say what it does *and* when to use it.\n\nSkills work across the Claude apps, Claude Code, and the API. On team plans they can be shared across the organisation, which is one of the best ways to spread best practice.\n\n## Projects vs. skills vs. connectors\n\n| | Gives Claude | Example |\n|---|---|---|\n| **Project** | Background context and files for a workspace | \"Everything about the Goa property\" |\n| **Skill** | A repeatable method for a type of task | \"How we write review responses\" |\n| **Connector** | Live access to a tool or data | \"Read and draft in my Gmail\" |\n\nThe best workflows use all three: a Project for context, a Skill for the method, and Connectors for the data.\n\n## Try it\n\n1. **Connect one tool** you use daily (calendar or email is a great start). Ask: *\"What should I prepare for this week?\"*\n2. **Cross-tool question.** With two connectors on, ask something that needs both, such as *\"Which meetings this week relate to email threads I haven't replied to?\"*\n3. **Create a skill** for a task you do at least weekly. Test it on three real cases and refine the instructions.\n\n## Key takeaways\n\n- Connectors (mostly built on MCP) let Claude read and act in your tools.\n- Grant minimum access, review actions, and watch for prompt injection.\n- Skills package your methods so Claude does a task your way, every time.\n- Projects + Skills + Connectors together make complete workflows.\n"}, {"id": "m12", "file": "12-agents.md", "room": "303", "floor": "C", "short": "Agents", "label": "Advanced · Module 12", "countable": true, "md": "# Module 12: Agents: Claude Code, Cowork, and Claude in Chrome\n\n**Track C · Advanced · ~30 minutes**\n\nIn a chat, Claude answers and you act. As an **agent**, Claude takes a goal, plans the steps, uses tools (files, a terminal, a browser, your apps), checks its own work, and keeps going until the job is done. You move from *asking* to *delegating*.\n\n## The mental model: a capable assistant with hands\n\nAn agent works in a loop:\n\n1. **Understand** the goal\n2. **Plan** the steps\n3. **Act** with a tool (read a file, run a command, click a button, search)\n4. **Observe** the result\n5. **Repeat** until done, then **report** back\n\nGood delegation to an agent looks like good delegation to a person: a clear goal, the context it needs, what \"done\" means, and what it must not touch.\n\n## Claude Code: agents for software\n\n**Claude Code** is Claude working directly in a codebase. It runs in your terminal, in IDEs like VS Code and JetBrains, in the desktop app, and on the web, where it runs in a cloud environment. It can:\n\n- read and understand an entire repository\n- write and edit code across many files\n- run tests, fix failures, and iterate\n- use git, open pull requests, and respond to review comments\n- connect to other tools through MCP (issue trackers, databases, docs)\n\n**For the engineers:** start with a well-scoped task (\"add input validation to the booking form and tests for it\"). Add a `CLAUDE.md` file to your repo describing how to build, test, and the conventions to follow, and review the diff like you would a colleague's.\n\n**For non-engineers:** Claude Code isn't only for developers. People use it to build internal tools, scripts that clean up spreadsheets, small websites, and data analyses, describing what they want in plain English. With the web version you can start a task from your browser or phone and come back to a finished result.\n\n## Cowork: agents for knowledge work\n\n**Cowork** brings the same agentic approach to everyday knowledge work in the Claude desktop app. You give Claude access to a folder and your connected apps, describe the outcome, and it works through the steps, such as:\n\n- *\"Go through the 40 vendor invoices in this folder, extract the amounts and due dates into a spreadsheet, and flag duplicates.\"*\n- *\"Read last month's guest feedback files and draft a summary deck with the top themes and recommended fixes.\"*\n- *\"Organise my Downloads folder into sensible subfolders and rename files consistently.\"*\n- *\"Using my calendar and inbox, prepare a briefing doc for each of tomorrow's meetings.\"*\n\nCowork can also run tasks on a schedule, such as a morning briefing every weekday, and use plugins that bundle skills and connectors for particular roles like marketing, operations, or sales.\n\n## Claude in Chrome: agents for the web\n\n**Claude in Chrome** is a browser extension that lets Claude see and act on web pages: navigate, click, fill forms, and pull information across tabs. Use it for:\n\n- comparing options across several websites (hotels, flights, software vendors)\n- filling repetitive web forms from a spreadsheet\n- pulling data from a web dashboard that has no export button\n- testing your own website's booking flow end to end\n\nIt asks for permission before acting on sites, and you can watch what it's doing.\n\n## Delegating well\n\nUse this checklist when handing a task to any agent:\n\n- **Goal:** what outcome do you want?\n- **Context:** where are the files or tools, and what background matters?\n- **Definition of done:** how will you, and the agent, know it's finished and correct?\n- **Boundaries:** what must it *not* do? (Don't send emails, don't delete files, don't spend money, ask before X.)\n- **Checkpoints:** when should it stop and check with you?\n\nExample:\n> Goal: build a competitor rate comparison for our 3 Goa properties for the next 4 weekends.\n> Context: competitors are listed in `competitors.xlsx`. Use public booking sites.\n> Done: a spreadsheet with one row per property × competitor × date, the lowest available double-room rate, and the source link.\n> Boundaries: read-only. Don't log in anywhere or start any booking.\n> Checkpoint: show me the first property's results before doing the rest.\n\n## Safety with agents\n\nAgents are powerful because they act, so mistakes act too.\n\n- **Start supervised.** Approve actions step by step until you trust a workflow, then loosen up.\n- **Limit access.** Give the agent only the folders, accounts, and permissions the task needs.\n- **Keep backups and use version control.** For files and code, make sure you can undo.\n- **Watch for prompt injection.** Web pages, emails, and documents can contain hidden instructions. Be especially careful when an agent reads untrusted content *and* can take actions like sending or paying.\n- **Review the output.** \"Done\" from an agent means \"ready for your review\", not \"ready to ship\".\n- **Keep sensitive actions human.** Payments, sending to customers, deleting data, and changing permissions should need your explicit approval.\n\n## Try it\n\n1. **Cowork (or Claude Code) on a folder.** Pick a messy folder of files you own and ask Claude to organise it and produce an index, with a checkpoint before it moves anything.\n2. **Multi-step research task.** Delegate a task that needs several steps, such as gathering prices from 5 vendor websites into a table, using the delegation checklist.\n3. **For engineers.** Run Claude Code on a real but small ticket. Write a `CLAUDE.md` for the repo first.\n\n## Key takeaways\n\n- Agents plan, act with tools, check their work, and keep going until the goal is met.\n- Claude Code handles software, Cowork handles knowledge work, and Claude in Chrome handles the web.\n- Delegate like a manager: goal, context, definition of done, boundaries, checkpoints.\n- Start supervised, limit access, and keep a human on sensitive actions.\n"}, {"id": "m13", "file": "13-building-with-the-api.md", "room": "304", "floor": "C", "short": "Building with the API", "label": "Advanced · Module 13 (optional)", "countable": true, "md": "# Module 13: Building with the Claude API (for builders)\n\n**Track C · Advanced · ~30 minutes · Optional: for engineers and technical PMs**\n\nEverything so far uses Claude's apps. The **Claude API** lets you build Claude into your own products and internal workflows. Examples include auto-tagging guest messages, summarising reviews every night, powering a support assistant, or extracting data from invoices.\n\n## When to use the API vs. the apps\n\n| Use the apps (or Cowork / Claude Code) when... | Use the API when... |\n|---|---|\n| A person is in the loop for each task | The task runs automatically, at volume |\n| The task varies each time | The task is the same shape every time |\n| You're exploring or prototyping | You're building it into a product or pipeline |\n\n**Start simple.** Most useful API features are a single call with a good prompt. Reach for agents only when a task genuinely needs open-ended, multi-step work.\n\n## Your first call (Python)\n\nGet an API key from the Claude Console, set it as the `ANTHROPIC_API_KEY` environment variable, then:\n\n```bash\npip install anthropic\n```\n\n```python\nimport anthropic\n\nclient = anthropic.Anthropic()  # reads ANTHROPIC_API_K
