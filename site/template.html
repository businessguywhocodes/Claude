<title>Claude 101 and Beyond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A practical course on using Claude well in personal and professional life, written for friends at HotelBFF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hotel-directory reader. Sticky top bar, a "floor directory" sidebar (tracks are floors, modules are rooms), one reading column. */
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --ink: #18211e;
  --muted: #5b6863;
  --line: #dde3df;
  --accent: #0e6b66;
  --accent-ink: #ffffff;
  --accent-soft: #e2efed;
  --marigold: #b97a0c;
  --marigold-soft: #f8edd6;
  --code-bg: #eef1ee;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w: 296px;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
    --accent: #4fbdb5; --accent-ink: #0b1513; --accent-soft: #1b2e2b;
    --marigold: #e8b04a; --marigold-soft: #2e2618; --code-bg: #1d2623;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
  --accent: #4fbdb5; --accent-ink: #0b1513; --accent-soft: #1b2e2b;
  --marigold: #e8b04a; --marigold-soft: #2e2618; --code-bg: #1d2623;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
  font-family: var(--font-ui);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; overflow: hidden; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .spacer { flex: 1; }
.btn {
  font-family: var(--font-ui); font-size: 14px; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary.done { background: var(--accent-soft); color: var(--accent); }
#menuBtn { display: none; }

/* Shell */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--bar-h)); }
.side {
  position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  font-family: var(--font-ui);
}
.progress { display: grid; gap: 6px; margin-bottom: 20px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.floor { margin-top: 18px; }
.floor h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a {
  display: grid; grid-template-columns: 52px 1fr 16px; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3;
}
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; text-align: center;
  padding: 2px 0; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); background: var(--bg);
  font-variant-numeric: tabular-nums;
}
.nav a[aria-current="page"] .tag { border-color: var(--accent); color: var(--accent); }
.tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); }
.tick.on { background: var(--accent); border-color: var(--accent); position: relative; }
.tick.on::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Reading column */
main { min-width: 0; padding-block: 36px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 46rem; margin: 0 auto; }
.keytag {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: 13px; color: var(--marigold);
  background: var(--marigold-soft); border-radius: 999px; padding: 4px 12px 4px 6px; margin-bottom: 14px;
}
.keytag i { font-style: normal; font-family: var(--font-mono); font-weight: 500; background: var(--marigold); color: var(--surface); border-radius: 999px; padding: 1px 8px; }

article h1, article h2, article h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; letter-spacing: -0.015em; }
article h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; margin: 0 0 6px; }
article h1 + p strong:only-child { font-family: var(--font-ui); font-weight: 500; font-size: 14px; color: var(--muted); }
article h2 { font-size: 25px; font-weight: 700; margin: 2.2em 0 0.5em; padding-top: 0.9em; border-top: 1px solid var(--line); }
article h3 { font-size: 19px; font-weight: 500; margin: 1.7em 0 0.4em; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li { margin: 0.25em 0; }
article li::marker { color: var(--accent); }
article blockquote {
  margin: 1.2em 0; padding: 12px 18px; border-left: 3px solid var(--marigold);
  background: var(--marigold-soft); border-radius: 0 8px 8px 0;
}
article blockquote p { margin: 0.4em 0; }
article code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
.codewrap { position: relative; margin: 1.2em 0; }
.codewrap pre {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; padding-top: 38px; overflow-x: auto; line-height: 1.55;
}
.codewrap pre code { background: none; padding: 0; font-size: 13.5px; white-space: pre; }
.copy {
  position: absolute; top: 8px; right: 8px; font-family: var(--font-ui); font-size: 12.5px;
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
}
.copy:hover { color: var(--accent); border-color: var(--accent); }
.tablewrap { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
article table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
article th, article td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
article th { font-family: var(--font-ui); font-weight: 600; font-size: 13.5px; color: var(--muted); background: var(--bg); }
article tr:last-child td { border-bottom: 0; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }

/* "Try it" and "Key takeaways" sections get a quiet panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 22px 14px; margin-top: 2em; }
.panel > h2 { border-top: 0; margin-top: 0.8em; padding-top: 0; font-size: 21px; }
.panel.try > h2 { color: var(--accent); }

.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); font-family: var(--font-ui); }
.pager a { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); max-width: 100%; }
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); font-size: 12px; }
.pager .next { margin-left: auto; text-align: right; }
.complete-row { display: flex; align-items: center; gap: 12px; margin-top: 36px; font-family: var(--font-ui); font-size: 14px; color: var(--muted); flex-wrap: wrap; }

/* Diagrams: classes come from course/diagrams/src, coloured from theme tokens */
figure.dg { margin: 1.8em 0; }
.dgscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.dgscroll svg { display: block; width: 100%; min-width: 540px; height: auto; color: var(--ink); }
figure.dg figcaption { font-family: var(--font-ui); font-size: 14px; line-height: 1.5; color: var(--muted); margin-top: 10px; max-width: 68ch; }
.dg .t { font: 500 13px var(--font-ui); fill: var(--ink); }
.dg .b { font-weight: 700; }
.dg .ts { font: 12px var(--font-ui); fill: var(--muted); }
.dg .tm { font: 500 12px var(--font-ui); fill: var(--marigold); }
.dg .ta { font: 600 12px var(--font-ui); fill: var(--accent); }
.dg .bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.dg .bxa { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.dg .bxm { fill: var(--marigold-soft); stroke: var(--marigold); stroke-width: 1.5; }
.dg .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg .lna { stroke: var(--accent); stroke-width: 2; fill: none; }
.dg .lnm { stroke: var(--marigold); stroke-width: 2; fill: none; }
.dg .dash { stroke-dasharray: 5 4; }
.dg .ahf { fill: var(--muted); fill: context-stroke; }

/* Quiz */
.quiz { margin-top: 2.6em; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 6px 22px 22px; font-family: var(--font-ui); }
.quiz > h2 { font-family: var(--font-display); font-size: 23px; margin: 0.8em 0 0.2em; letter-spacing: -0.01em; }
.quiz > p.lead { color: var(--muted); margin: 0 0 1em; font-size: 15px; }
.q { padding: 16px 0; border-top: 1px solid var(--line); }
.q-text { font-weight: 600; font-size: 16px; line-height: 1.45; margin: 0 0 10px; }
.q-num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left;
  font: inherit; font-size: 15px; line-height: 1.45; color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .letter { font-family: var(--font-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--muted); }
.opt.right { border-color: var(--accent); background: var(--accent-soft); }
.opt.right .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.wrong { border-color: var(--marigold); background: var(--marigold-soft); }
.opt.wrong .letter { background: var(--marigold); border-color: var(--marigold); color: var(--surface); }
.why { margin: 10px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--ink); padding: 10px 12px; border-radius: 8px; background: var(--bg); border-left: 3px solid var(--accent); }
.why.miss { border-left-color: var(--marigold); }
.why b { font-weight: 700; }
.quiz-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.score { font-weight: 600; font-variant-numeric: tabular-nums; }
.nav .best { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }

@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  .brand span { display: none; }
  .brand b { font-size: 17px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 15; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0;
    width: min(320px, 88vw); height: auto; transform: translateX(-105%); transition: transform .2s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .side.open { transform: none; }
  main { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <button class="btn" id="menuBtn" aria-controls="side" aria-expanded="false">Contents</button>
  <a class="brand" href="#welcome"><b>Claude 101 and Beyond</b><span>A course for friends at HotelBFF</span></a>
  <button class="btn" id="themeBtn" aria-label="Switch colour theme">Theme</button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Course contents">
    <div class="progress">
      <div class="progress-label"><span>Your progress</span><span id="progressText">0 of 0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div id="nav"></div>
  </nav>
  <main>
    <div class="page">
      <div class="keytag" id="keytag"><i>Lobby</i><span>Start here</span></div>
      <article id="article"><p>Loading the course…</p></article>
      <section class="quiz" id="quiz" hidden></section>
      <div class="complete-row" id="completeRow">
        <button class="btn primary" id="doneBtn">Mark this module as done</button>
        <span>Progress is saved in this browser only.</span>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const MODULES = /*__MODULES__*/[];

const FLOORS = [
  { key: "lobby", name: "Lobby" },
  { key: "A", name: "Floor 1 · Foundations" },
  { key: "B", name: "Floor 2 · Everyday leverage" },
  { key: "C", name: "Floor 3 · Advanced" },
  { key: "top", name: "Rooftop & extras" },
];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let done = new Set(store.get("c101-done", []));
const countable = MODULES.filter(m => m.countable);

function byId(id) { return MODULES.find(m => m.id === id); }
function fileToId(href) {
  const f = href.split("/").pop().split("#")[0];
  const m = MODULES.find(x => x.file === f);
  return m ? m.id : null;
}

function buildNav(current) {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  FLOORS.forEach(fl => {
    const items = MODULES.filter(m => m.floor === fl.key);
    if (!items.length) return;
    const sec = document.createElement("div");
    sec.className = "floor";
    const h = document.createElement("h3");
    h.textContent = fl.name;
    const ul = document.createElement("ul");
    ul.className = "nav";
    items.forEach(m => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + m.id;
      if (m.id === current) a.setAttribute("aria-current", "page");
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = m.room;
      const t = document.createElement("span"); t.textContent = m.short;
      const best = (m.quiz && m.quiz.length) ? store.get("c101-quiz-" + m.id, -1) : -1;
      if (best >= 0) { const sb = document.createElement("span"); sb.className = "best"; sb.textContent = " · quiz " + best + "/" + m.quiz.length; t.append(sb); }
      const tick = document.createElement("span"); tick.className = "tick" + (done.has(m.id) ? " on" : "");
      if (!m.countable) tick.style.visibility = "hidden";
      a.append(tag, t, tick);
      li.append(a); ul.append(li);
    });
    sec.append(h, ul); nav.append(sec);
  });
  const n = countable.filter(m => done.has(m.id)).length;
  document.getElementById("progressText").textContent = n + " of " + countable.length + " done";
  document.getElementById("progressFill").style.width = (100 * n / countable.length) + "%";
}

function addCopy(pre) {
  const wrap = document.createElement("div");
  wrap.className = "codewrap";
  pre.replaceWith(wrap); wrap.append(pre);
  const b = document.createElement("button");
  b.className = "copy"; b.type = "button"; b.textContent = "Copy";
  b.addEventListener("click", () => {
    const text = pre.innerText;
    const ok = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = "Selected: press Ctrl/⌘+C";
      setTimeout(() => b.textContent = "Copy", 2500);
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  });
  wrap.append(b);
}

function wrapPanels(article) {
  // Group "Try it" and "Key takeaways" h2 sections into panels.
  [...article.querySelectorAll("h2")].forEach(h => {
    const label = h.textContent.trim().toLowerCase();
    if (label !== "try it" && label !== "key takeaways") return;
    const panel = document.createElement("section");
    panel.className = "panel" + (label === "try it" ? " try" : "");
    h.before(panel);
    let n = h;
    while (n && !(n !== h && n.tagName === "H2")) { const next = n.nextElementSibling; panel.append(n); n = next; }
  });
}

function render(id) {
  const m = byId(id) || MODULES[0];
  const article = document.getElementById("article");
  if (window.marked) {
    article.innerHTML = marked.parse(m.md, { gfm: true });
  } else {
    const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = m.md;
    article.innerHTML = ""; article.append(pre);
  }
  article.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.append(t); });
  article.querySelectorAll("pre").forEach(addCopy);
  article.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/\.md(#.*)?$/.test(href) && !/^https?:/.test(href)) {
      const target = fileToId(href);
      if (target) a.setAttribute("href", "#" + target);
    } else if (/^https?:/.test(href)) {
      a.target = "_blank"; a.rel = "noopener";
    }
  });
  wrapPanels(article);

  const kt = document.getElementById("keytag");
  kt.innerHTML = "";
  const i = document.createElement("i"); i.textContent = m.room;
  const s = document.createElement("span"); s.textContent = m.label;
  kt.append(i, s);

  renderQuiz(m);
  const row = document.getElementById("completeRow");
  row.hidden = !m.countable;
  updateDoneBtn(m);

  const idx = MODULES.indexOf(m);
  const pager = document.getElementById("pager");
  pager.innerHTML = "";
  const mk = (mm, cls, lbl) => {
    const a = document.createElement("a"); a.href = "#" + mm.id; a.className = cls;
    const sm = document.createElement("small"); sm.textContent = lbl;
    const t = document.createElement("span"); t.textContent = mm.room + " · " + mm.short;
    a.append(sm, t); return a;
  };
  if (idx > 0) pager.append(mk(MODULES[idx - 1], "prev", "Previous"));
  if (idx < MODULES.length - 1) pager.append(mk(MODULES[idx + 1], "next", "Next"));

  document.title = m.id === "welcome" ? "Claude 101 and Beyond" : m.short + " · Claude 101 and Beyond";
  buildNav(m.id);
  store.set("c101-last", m.id);
}


function renderQuiz(m) {
  const box = document.getElementById("quiz");
  box.innerHTML = "";
  const qs = m.quiz || [];
  box.hidden = qs.length === 0;
  if (!qs.length) return;
  const h = document.createElement("h2");
  h.textContent = m.id === "capstone" ? "Final quiz" : "Check your understanding";
  const lead = document.createElement("p");
  lead.className = "lead";
  lead.textContent = qs.length + " questions. Pick an answer to see the explanation.";
  box.append(h, lead);
  let answered = 0, correct = 0;
  const foot = document.createElement("div"); foot.className = "quiz-foot";
  const score = document.createElement("span"); score.className = "score";
  const retry = document.createElement("button"); retry.className = "btn"; retry.type = "button"; retry.textContent = "Try again";
  retry.addEventListener("click", () => { renderQuiz(m); box.scrollIntoView({ block: "start" }); });
  const updateScore = () => {
    score.textContent = answered < qs.length
      ? answered + " of " + qs.length + " answered"
      : "You scored " + correct + " of " + qs.length + (correct === qs.length ? ". Perfect." : ".");
    retry.hidden = answered < qs.length;
  };
  qs.forEach((q, qi) => {
    const wrap = document.createElement("div"); wrap.className = "q";
    const p = document.createElement("p"); p.className = "q-text";
    const n = document.createElement("span"); n.className = "q-num"; n.textContent = (qi + 1) + ".";
    p.append(n, document.createTextNode(q.q));
    const opts = document.createElement("div"); opts.className = "opts";
    const buttons = q.options.map((o, oi) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opt";
      const l = document.createElement("span"); l.className = "letter"; l.textContent = "ABCD"[oi];
      const t = document.createElement("span"); t.textContent = o;
      b.append(l, t);
      b.addEventListener("click", () => {
        buttons.forEach(x => x.disabled = true);
        const ok = oi === q.answer;
        buttons[q.answer].classList.add("right");
        if (!ok) b.classList.add("wrong");
        const why = document.createElement("p"); why.className = "why" + (ok ? "" : " miss");
        const lead = document.createElement("b"); lead.textContent = ok ? "Correct. " : "Not quite. The answer is " + "ABCD"[q.answer] + ". ";
        why.append(lead, document.createTextNode(q.why));
        wrap.append(why);
        answered++; if (ok) correct++;
        updateScore();
        if (answered === qs.length) {
          const best = store.get("c101-quiz-" + m.id, -1);
          if (correct > best) store.set("c101-quiz-" + m.id, correct);
          buildNav(m.id);
        }
      });
      opts.append(b);
      return b;
    });
    wrap.append(p, opts);
    box.append(wrap);
  });
  foot.append(score, retry);
  box.append(foot);
  updateScore();
}

function updateDoneBtn(m) {
  const b = document.getElementById("doneBtn");
  const isDone = done.has(m.id);
  b.textContent = isDone ? "Done ✓ (click to undo)" : "Mark this module as done";
  b.classList.toggle("done", isDone);
}

document.getElementById("doneBtn").addEventListener("click", () => {
  const id = currentId();
  done.has(id) ? done.delete(id) : done.add(id);
  store.set("c101-done", [...done]);
  updateDoneBtn(byId(id));
  buildNav(id);
});

function currentId() {
  const h = location.hash.replace("#", "");
  return byId(h) ? h : MODULES[0].id;
}

const side = document.getElementById("side");
const menuBtn = document.getElementById("menuBtn");
menuBtn.addEventListener("click", () => {
  const open = side.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open);
});
side.addEventListener("click", e => { if (e.target.closest("a")) { side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", false); } });

const themeBtn = document.getElementById("themeBtn");
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(store.get("c101-theme", null));
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next); store.set("c101-theme", next);
});

window.addEventListener("hashchange", () => { render(currentId()); window.scrollTo(0, 0); });
if (!location.hash) {
  const last = store.get("c101-last", null);
  render(last && byId(last) ? last : MODULES[0].id);
} else {
  render(currentId());
}
</script>
